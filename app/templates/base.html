<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyMate AI{% endblock %} — StudyMate AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'background': '#faf8ff',
            'surface': '#faf8ff',
            'surface-dim': '#d2d9f4',
            'surface-bright': '#faf8ff',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f2f3ff',
            'surface-container': '#eaedff',
            'surface-container-high': '#e2e7ff',
            'surface-container-highest': '#dae2fd',
            'surface-variant': '#dae2fd',
            'surface-tint': '#4d44e3',
            'on-surface': '#131b2e',
            'on-surface-variant': '#464555',
            'outline': '#777587',
            'outline-variant': '#c7c4d8',
            'primary': '#3525cd',
            'on-primary': '#ffffff',
            'primary-container': '#4f46e5',
            'on-primary-container': '#dad7ff',
            'primary-fixed': '#e2dfff',
            'primary-fixed-dim': '#c3c0ff',
            'on-primary-fixed': '#0f0069',
            'on-primary-fixed-variant': '#3323cc',
            'secondary': '#6b38d4',
            'on-secondary': '#ffffff',
            'secondary-container': '#8455ef',
            'on-secondary-container': '#fffbff',
            'secondary-fixed': '#e9ddff',
            'secondary-fixed-dim': '#d0bcff',
            'on-secondary-fixed': '#23005c',
            'on-secondary-fixed-variant': '#5516be',
            'tertiary': '#006e4b',
            'on-tertiary': '#ffffff',
            'tertiary-container': '#006e4b',
            'on-tertiary-container': '#67f4b7',
            'tertiary-fixed': '#6ffbbe',
            'tertiary-fixed-dim': '#4edea3',
            'on-tertiary-fixed': '#002113',
            'on-tertiary-fixed-variant': '#005236',
            'error': '#ba1a1a',
            'on-error': '#ffffff',
            'error-container': '#ffdad6',
            'on-error-container': '#93000a',
            'inverse-surface': '#283044',
            'inverse-on-surface': '#eef0ff',
            'inverse-primary': '#c3c0ff',
          },
          fontFamily: {
            'display': ['"Plus Jakarta Sans"', 'sans-serif'],
            'body': ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'DEFAULT': '0.25rem',
            'lg': '0.5rem',
            'xl': '0.75rem',
            'full': '9999px',
          },
          spacing: {
            'space-xs': '0.5rem', 'space-sm': '0.75rem', 'space-md': '1rem',
            'space-lg': '1.5rem', 'space-xl': '2rem', 'space-2xl': '3rem',
            'space-3xl': '4rem',
            'gutter': '1.5rem',
            'content-max-width': '75rem',
          },
          fontSize: {
            'display-lg': ['3rem', { lineHeight: '1.15', letterSpacing: '-0.025em', fontWeight: '700' }],
            'display-md': ['2.25rem', { lineHeight: '1.18', letterSpacing: '-0.02em', fontWeight: '700' }],
            'headline-lg': ['2rem', { lineHeight: '1.25', fontWeight: '600' }],
            'headline-md': ['1.5rem', { lineHeight: '1.3', fontWeight: '600' }],
            'headline-sm': ['1.25rem', { lineHeight: '1.35', fontWeight: '600' }],
            'body-lg': ['1.125rem', { lineHeight: '1.6' }],
            'body-md': ['1rem', { lineHeight: '1.5' }],
            'body-sm': ['0.875rem', { lineHeight: '1.45' }],
            'label-lg': ['1rem', { lineHeight: '1.4', fontWeight: '500' }],
            'label-md': ['0.875rem', { lineHeight: '1.4', fontWeight: '500' }],
            'label-sm': ['0.75rem', { lineHeight: '1.4', fontWeight: '600' }],
          },
          boxShadow: {
            'glow-primary': '0 8px 30px rgba(53, 37, 205, 0.18)',
            'card': '0 1px 3px rgba(19, 27, 46, 0.08), 0 4px 16px rgba(53, 37, 205, 0.06)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
{% block body_tag %}<body class="h-full bg-surface font-body text-body-md text-on-surface antialiased">{% endblock %}
  {% block content %}{% endblock %}
</body>
</html>
